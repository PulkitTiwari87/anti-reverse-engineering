name: Feature request
description: Suggest an improvement or a new agent adapter
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What risk or workflow gap are you trying to address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Say whether it is guidance, detection, or enforcement. This project ships only guidance and light detection.
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This does not require offensive anti-analysis or malware-evasion capabilities
          required: true
