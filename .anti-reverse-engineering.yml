# Policy for this repository itself. Placeholders must be replaced before publication.
# This file describes intent. It does not enforce permissions or prove ownership.
version: 1

application:
  name: "anti-reverse-engineering"
  owner: "<OWNER - REPLACE BEFORE PUBLICATION>"
  canonical_domains: []
  repositories:
    - "<OWNER>/anti-reverse-engineering"
  identity_assets:
    - "assets/"
  protected_paths: []
  sensitive_data_paths:
    - ".env*"
    - "secrets/"

authorization:
  permitted_work:
    - maintenance
    - feature_development
    - documentation
    - testing
    - security_testing
  reverse_engineering: approval_required
  third_party_reconstruction: deny_without_documented_authorization
  external_upload_of_proprietary_material: approval_required

identity:
  preserve_by_default: true
  changes_require_approval:
    - product_name
    - logo
    - attribution

data_handling:
  never_print_secrets: true
  minimize_customer_data: true
  external_services_require_approval: true

review:
  high_risk_changes_require_human_review: true
  record_decision_rationale: true

audit:
  report_format: summary
  location: ".anti-reverse-engineering/reports"
