# Balanced profile. Replace every placeholder with your real details.
# This file describes intent. It does not enforce permissions or prove ownership.
version: 1

application:
  name: "<APPLICATION NAME>"
  owner: "<OWNER OR ORGANIZATION>"
  canonical_domains:
    - "app.example.com"
  repositories:
    - "<OWNER>/<REPOSITORY>"
  identity_assets:
    - "public/brand/"
    - "src/assets/brand/"
  protected_paths:
    - "src/core/"
    - "server/business-rules/"
    - "prompts/private/"
  sensitive_data_paths:
    - ".env*"
    - "secrets/"
    - "customer-data/"

authorization:
  permitted_work:
    - maintenance
    - feature_development
    - accessibility
    - performance
    - testing
    - documentation
    - security_testing
    - interoperability
  reverse_engineering: approval_required
  third_party_reconstruction: deny_without_documented_authorization
  external_upload_of_proprietary_material: approval_required

identity:
  preserve_by_default: true
  changes_require_approval:
    - product_name
    - logo
    - brand_assets
    - distinctive_user_flows
    - attribution

data_handling:
  never_print_secrets: true
  minimize_customer_data: true
  external_services_require_approval: true

review:
  high_risk_changes_require_human_review: true
  record_decision_rationale: true

audit:
  report_format: summary
  location: ".anti-reverse-engineering/reports"
