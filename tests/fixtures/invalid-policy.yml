# Synthetic INVALID policy used by tests. The fake secret-like strings must never
# appear in validator output. They are not real credentials.
version: 1
application:
  name: "Test App"
  owner: "Test Owner"
  canonical_domains: ["test.example.com"]
  repositories: ["test-owner/test-app"]
  identity_assets: ["public/brand/"]
  protected_paths: ["src/core/"]
  sensitive_data_paths: [".env*"]
authorization:
  permitted_work: [maintenance, FAKE-NOT-A-REAL-SECRET-ENUM]
  reverse_engineering: FAKE-NOT-A-REAL-SECRET-VALUE
  third_party_reconstruction: deny
  external_upload_of_proprietary_material: approval_required
identity:
  preserve_by_default: "yes"
  changes_require_approval: [logo]
data_handling:
  never_print_secrets: true
  minimize_customer_data: true
  external_services_require_approval: true
review:
  high_risk_changes_require_human_review: true
